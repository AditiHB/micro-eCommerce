name: Docker Build & Push

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, develop ]
  workflow_run:
    workflows: [ Build & Code Quality ]
    types: [ completed ]
    branches: [ main, develop, 'claude/**' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - customer-service
          - inventory-service
          - order-service
          - payment-service

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Dockerfile for service
        run: |
          cat > /tmp/Dockerfile.${{ matrix.service }} << 'EOF'
          FROM maven:3.9.6-eclipse-temurin-17-alpine AS builder
          WORKDIR /app
          COPY . .
          RUN mvn clean package -DskipTests=true -pl services/${{ matrix.service }} -am -q

          FROM eclipse-temurin:17-jre-alpine
          WORKDIR /app
          COPY --from=builder /app/services/${{ matrix.service }}/target/*.jar app.jar
          RUN addgroup -g 1000 appuser && adduser -u 1000 -G appuser appuser && chown appuser:appuser /app
          USER appuser
          EXPOSE 8080
          HEALTHCHECK --interval=30s --timeout=3s --start-period=40s --retries=3 \
            CMD wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
          ENTRYPOINT ["java", "-XX:+UseG1GC", "-XX:MaxRAMPercentage=75.0", "-jar", "app.jar"]
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: /tmp/Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image built with digest: ${{ steps.build.outputs.digest }}"

  scan-images:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service:
          - customer-service
          - inventory-service
          - order-service
          - payment-service

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

  notify-build:
    runs-on: ubuntu-latest
    needs: [build-images, scan-images]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Notify Slack - Docker Build Status
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Docker Build Status",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Docker Images Built*\n${{ needs.build-images.result == 'success' && '✅ Images Built Successfully' || '❌ Build Failed' }}\n*Image Scanning*\n${{ needs.scan-images.result == 'success' && '✅ Vulnerabilities Scanned' || '⚠️ Scan Issues' }}\nRegistry: `${{ env.REGISTRY }}`\nBranch: `${{ github.ref_name }}`"
                  }
                }
              ]
            }
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}

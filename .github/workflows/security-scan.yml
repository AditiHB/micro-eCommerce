name: Security Scanning

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sunday at 2 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -Dformat=SARIF || true

      - name: Upload OWASP DependencyCheck results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'dependency-check-report.sarif'
          category: owasp-dependency-check
          wait-for-processing: true

  maven-audit:
    runs-on: ubuntu-latest
    name: Maven Dependency Audit

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Check for vulnerable dependencies
        run: mvn versions:display-dependency-updates

      - name: Analyze Maven plugins
        run: mvn help:describe -Dplugin=org.apache.maven.plugins:maven-dependency-plugin:LATEST

      - name: Generate dependency tree
        run: mvn dependency:tree > dependency-tree.txt || true

      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 30

  sca-snyk:
    runs-on: ubuntu-latest
    name: Snyk Software Composition Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk scan
        uses: snyk/actions/maven-3-jdk-17@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all
        continue-on-error: true

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'snyk.sarif'
          category: snyk
        continue-on-error: true

  secret-scanning:
    runs-on: ubuntu-latest
    name: Secrets Detection

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL Security Analysis

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Build for CodeQL analysis
        run: mvn clean package -DskipTests=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: /language:java

  notify-security:
    runs-on: ubuntu-latest
    needs: [dependency-check, maven-audit, sca-snyk, secret-scanning, codeql]
    if: always()

    steps:
      - name: Notify Slack - Security Scan Status
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Security Scan Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Security Scans Completed*\n*Dependency Check*: ${{ needs.dependency-check.result == 'success' && '✅' || '⚠️' }}\n*Maven Audit*: ${{ needs.maven-audit.result == 'success' && '✅' || '⚠️' }}\n*Snyk SCA*: ${{ needs.sca-snyk.result == 'success' && '✅' || '⚠️' }}\n*Secrets Scan*: ${{ needs.secret-scanning.result == 'success' && '✅' || '⚠️' }}\n*CodeQL*: ${{ needs.codeql.result == 'success' && '✅' || '⚠️' }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Security Alerts"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/security"
                    }
                  ]
                }
              ]
            }
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}

auth_enabled: false

ingester:
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  max_chunk_age: 1h
  chunk_encoding: snappy
  chunk_size_bytes: 262144

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 720h

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

server:
  http_listen_port: 3100
  log_level: info

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shards_min_bytes: 1e6
  cache_results: true
  results_cache:
    cache:
      enable_fifocache: true
      default_validity: 1m
      memcached:
        batch_size: 1024
        parallelism: 100
      memcached_client:
        addresses: localhost:11211
        update_interval: 1m
        max_idle_conns: 100

cache_config:
  enable_fifocache: true
  default_validity: 1h
  background:
    writeback_goroutines: 10
    writeback_chan_size: 10000
  fifo_cache:
    default_validity: 1h
    max_size_items: 1024
    max_size_bytes: 1gb
  memcached_client:
    addresses: localhost:11211
    update_interval: 1m
    max_idle_conns: 100

frontend:
  compress_responses: true
  log_queries_longer_than: 10s
  downstream_url: http://localhost:3100

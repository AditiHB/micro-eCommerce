global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'micro-ecommerce'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:9080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: service

  # Customer Service
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-service:9081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: service

  # Inventory Service (with service discovery)
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    # Eureka requires credentials. The password is read from a file (mounted from the compose secret),
    # never inlined in this config.
    eureka_sd_configs:
      - server: 'http://discovery-server:8761/eureka'
        basic_auth:
          username: eureka
          password_file: /run/secrets/eureka_password
    relabel_configs:
      # Eureka advertises the public API port; metrics are served on the internal management port.
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: __address__
        replacement: '$1:9082'
      - source_labels: [__meta_eureka_app_name]
        target_label: service
      - source_labels: [__meta_eureka_instance_id]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(inventory|ecommerce)_.*'
        action: keep

  # Order Service
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:9083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: service

  # Payment Service
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:9084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: service

  # Notification Service
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:9086']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [job]
        target_label: service

  # Kafka metrics (via JMX exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Elasticsearch metrics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker daemon metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']

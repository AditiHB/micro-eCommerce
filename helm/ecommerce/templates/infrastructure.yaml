{{- if .Values.infrastructure.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app: redis
spec:
  serviceName: redis
  replicas: {{ .Values.infrastructure.redis.replicaCount }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.infrastructure.redis.port }}
          name: redis
        resources:
          {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.infrastructure.redis.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
  - port: {{ .Values.infrastructure.redis.port }}
    targetPort: {{ .Values.infrastructure.redis.port }}
{{- end }}

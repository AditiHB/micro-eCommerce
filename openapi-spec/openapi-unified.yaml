openapi: 3.0.0
info:
  title: E-Commerce Microservices API
  description: |
    Comprehensive API documentation for the E-Commerce Microservices platform.
    This unified specification documents all microservices APIs including:
    - Customer Service
    - Order Service
    - Inventory Service
    - Payment Service
    - Authentication Service
  version: '1.0.0'
  contact:
    name: E-Commerce API Support
    email: api-support@ecommerce.local
    url: https://ecommerce.local/support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local Development
  - url: https://api.staging.ecommerce.local
    description: Staging Environment
  - url: https://api.ecommerce.local
    description: Production Environment

tags:
  - name: Authentication
    description: Authentication is handled by Keycloak, not by this API (no login endpoint). See docs/KEYCLOAK_IDENTITY.md.
  - name: Customer Management
    description: APIs for managing customers
  - name: Order Management
    description: APIs for managing orders
  - name: Inventory Management
    description: APIs for managing inventory
  - name: Payment Management
    description: APIs for managing payments

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          enum:
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - INSUFFICIENT_STOCK
            - EVENT_PUBLISHING_ERROR
            - BUSINESS_ERROR
            - INTERNAL_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - AUTHENTICATION_FAILED
        message:
          type: string
          example: Resource not found
        timestamp:
          type: string
          format: date-time
        details:
          type: object

    PagedResponse:
      type: object
      required:
        - content
        - pageNumber
        - pageSize
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            type: object
        pageNumber:
          type: integer
          format: int32
          example: 0
        pageSize:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 100
        totalPages:
          type: integer
          format: int32
          example: 5

    AuthResponse:
      type: object
      required:
        - token
        - expiresIn
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          format: int64
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          example: john_doe
        email:
          type: string
          format: email
          example: john@example.com
        roles:
          type: array
          items:
            type: string
          example:
            - USER
            - ADMIN

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          example: john_doe
        password:
          type: string
          format: password
          minLength: 6
          example: securePassword123

    CustomerResponse:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: customer@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        phoneNumber:
          type: string
          example: '+1-555-0123'
        address:
          type: string
          example: '123 Main St, Anytown, USA'
        city:
          type: string
          example: Anytown
        country:
          type: string
          example: USA
        postalCode:
          type: string
          example: '12345'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Doe
        phoneNumber:
          type: string
          example: '+1-555-0123'
        address:
          type: string
          example: '123 Main St, Anytown, USA'
        city:
          type: string
          example: Anytown
        country:
          type: string
          example: USA
        postalCode:
          type: string
          example: '12345'

    OrderResponse:
      type: object
      required:
        - id
        - customerId
        - status
        - totalAmount
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        customerId:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - SHIPPED
            - DELIVERED
            - CANCELLED
            - FAILED
          example: PENDING
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: double
          example: 299.99
        paymentId:
          type: integer
          format: int64
        shippingAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 149.99
        subtotal:
          type: number
          format: double
          example: 299.98

    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        shippingAddress:
          type: string
          example: '123 Main St, Anytown, USA'

    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    InventoryResponse:
      type: object
      required:
        - id
        - productId
        - quantity
        - reserved
      properties:
        id:
          type: integer
          format: int64
          example: 1
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          example: 100
        reserved:
          type: integer
          example: 10
        available:
          type: integer
          example: 90
        reorderLevel:
          type: integer
          example: 20
        lastRestockDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInventoryRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          minimum: 0
          example: 100
        reorderLevel:
          type: integer
          minimum: 0
          example: 20

    PaymentResponse:
      type: object
      required:
        - id
        - orderId
        - amount
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        orderId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          format: double
          example: 299.99
        currency:
          type: string
          example: USD
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
            - FAILED
            - REFUNDED
          example: PENDING
        paymentMethod:
          type: string
          example: CREDIT_CARD
        transactionId:
          type: string
          example: txn_1234567890
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProcessPaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - paymentMethod
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 299.99
        currency:
          type: string
          default: USD
          example: USD
        paymentMethod:
          type: string
          enum:
            - CREDIT_CARD
            - DEBIT_CARD
            - PAYPAL
            - BANK_TRANSFER
          example: CREDIT_CARD
        cardToken:
          type: string
          description: Encrypted card token for payment processing
          example: tok_visa

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RS256 access token issued by Keycloak (realm `ecommerce`). There is no login endpoint on this
        API: obtain a token from Keycloak's token endpoint, then send it as `Authorization: Bearer <token>`.
        See docs/KEYCLOAK_IDENTITY.md for roles and object-level rules.

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (0-indexed)
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0

    SizeParam:
      name: size
      in: query
      description: Page size
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20

    SortByParam:
      name: sortBy
      in: query
      description: Field to sort by
      schema:
        type: string
        default: id
      example: id

security:
  - BearerAuth: []

paths:
  /api/customers:
    get:
      tags:
        - Customer Management
      summary: Get all customers
      description: Retrieve all customers with pagination support
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortByParam'
      responses:
        '200':
          description: Successfully retrieved customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Customer Management
      summary: Create a new customer
      description: Create a new customer with provided information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/customers/{id}:
    get:
      tags:
        - Customer Management
      summary: Get customer by ID
      description: Retrieve a specific customer by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customer Management
      summary: Update customer
      description: Update an existing customer's information
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Customer Management
      summary: Delete customer
      description: Delete a customer by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Customer deleted successfully
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    get:
      tags:
        - Order Management
      summary: Get all orders
      description: Retrieve all orders with pagination support
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortByParam'
      responses:
        '200':
          description: Successfully retrieved orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Order Management
      summary: Create a new order
      description: Create a new order with resilience patterns (circuit breaker & retry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable (circuit breaker open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      tags:
        - Order Management
      summary: Get order by ID
      description: Retrieve a specific order by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/status:
    put:
      tags:
        - Order Management
      summary: Update order status
      description: Update the status of an existing order
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
          example: 1
        - name: status
          in: query
          required: true
          description: New order status
          schema:
            type: string
            enum:
              - PENDING
              - CONFIRMED
              - SHIPPED
              - DELIVERED
              - CANCELLED
              - FAILED
          example: CONFIRMED
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory:
    get:
      tags:
        - Inventory Management
      summary: Get all inventory items
      description: Retrieve all inventory items with pagination support
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortByParam'
      responses:
        '200':
          description: Successfully retrieved inventory items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/InventoryResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Inventory Management
      summary: Create inventory
      description: Create new inventory for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequest'
      responses:
        '201':
          description: Inventory created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory/{id}:
    get:
      tags:
        - Inventory Management
      summary: Get inventory by ID
      description: Retrieve a specific inventory item by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Inventory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Inventory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Inventory Management
      summary: Update inventory quantity
      description: Update the quantity of an inventory item
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory ID
          schema:
            type: integer
            format: int64
          example: 1
        - name: quantity
          in: query
          required: true
          description: New quantity
          schema:
            type: integer
            minimum: 0
          example: 100
      responses:
        '200':
          description: Inventory updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Invalid quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Inventory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory/{id}/reserve:
    post:
      tags:
        - Inventory Management
      summary: Reserve stock
      description: Reserve stock for an order
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory ID
          schema:
            type: integer
            format: int64
          example: 1
        - name: quantity
          in: query
          required: true
          description: Quantity to reserve
          schema:
            type: integer
            minimum: 1
          example: 5
      responses:
        '200':
          description: Stock reserved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Inventory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory/{id}/release:
    post:
      tags:
        - Inventory Management
      summary: Release stock
      description: Release reserved stock back to inventory
      parameters:
        - name: id
          in: path
          required: true
          description: Inventory ID
          schema:
            type: integer
            format: int64
          example: 1
        - name: quantity
          in: query
          required: true
          description: Quantity to release
          schema:
            type: integer
            minimum: 1
          example: 5
      responses:
        '200':
          description: Stock released successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Inventory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments:
    get:
      tags:
        - Payment Management
      summary: Get all payments
      description: Retrieve all payments with pagination support
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortByParam'
      responses:
        '200':
          description: Successfully retrieved payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Payment Management
      summary: Process a payment
      description: Process a new payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '201':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/{id}:
    get:
      tags:
        - Payment Management
      summary: Get payment by ID
      description: Retrieve a specific payment by their ID
      parameters:
        - name: id
          in: path
          required: true
          description: Payment ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/{id}/refund:

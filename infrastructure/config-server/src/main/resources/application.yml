server:
  port: 8888

spring:
  application:
    name: config-server
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:config}
      # No default: never run with a known password.
      password: ${CONFIG_SERVER_PASSWORD}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file:///config-repo}
          # In a real environment, you would use a remote Git repository:
          # uri: https://github.com/your-username/ecommerce-config-repo.git
          default-label: main
          clone-on-start: true
    # Config Monitor's /monitor webhook publishes a RefreshRemoteApplicationEvent onto this bus when
    # config-repo changes; every client (spring-cloud-starter-bus-kafka on its own classpath too) picks it
    # up and refreshes. The same broadcast also happens if /actuator/busrefresh is POSTed directly to any
    # one bus member, including this server - the monitor webhook is a convenience, not the only trigger.
    bus:
      enabled: true
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          auto-create-topics: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9888}
  endpoints:
    web:
      exposure:
        include: health,prometheus,busrefresh
  endpoint:
    health:
      probes:
        enabled: true

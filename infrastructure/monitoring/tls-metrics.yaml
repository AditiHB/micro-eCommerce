apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-metrics-config
  namespace: monitoring
data:
  tls-collector.sh: |
    #!/bin/bash
    # TLS/SSL Metrics Collector
    # Exports Prometheus metrics for TLS security monitoring

    PORT=${TLS_METRICS_PORT:-9091}
    SERVICES=${SERVICES:-"api-gateway:8443 payment-service:8443 order-service:8443"}

    collect_tls_metrics() {
      local service=$1
      local host=$(echo $service | cut -d: -f1)
      local port=$(echo $service | cut -d: -f2)

      # Get TLS version
      local tls_version=$(echo | openssl s_client -connect $host:$port 2>/dev/null | grep "Protocol" | awk '{print $NF}')
      case $tls_version in
        "TLSv1.3") echo "tls_version_info{service=\"$host\",version=\"1.3\"} 1" ;;
        "TLSv1.2") echo "tls_version_info{service=\"$host\",version=\"1.2\"} 1" ;;
        "TLSv1.0") echo "tls_version_info{service=\"$host\",version=\"1.0\"} 1" ;;
        "SSLv3") echo "tls_version_info{service=\"$host\",version=\"ssl3\"} 1" ;;
        *) echo "tls_version_info{service=\"$host\",version=\"unknown\"} 0" ;;
      esac

      # Get cipher suite
      local cipher=$(echo | openssl s_client -connect $host:$port 2>/dev/null | grep "Cipher" | awk '{print $NF}')
      case $cipher in
        *"256"*|*"CHACHA"*) echo "cipher_suite_strength{service=\"$host\",cipher=\"$cipher\",strength=\"strong\"} 1" ;;
        *"128"*) echo "cipher_suite_strength{service=\"$host\",cipher=\"$cipher\",strength=\"medium\"} 1" ;;
        *"RC4"*|*"DES"*|*"MD5"*|*"EXPORT"*) echo "cipher_suite_strength{service=\"$host\",cipher=\"$cipher\",strength=\"weak\"} 1" ;;
        *) echo "cipher_suite_strength{service=\"$host\",cipher=\"$cipher\",strength=\"unknown\"} 0" ;;
      esac

      # Certificate chain validation
      local chain_valid=$(openssl s_client -connect $host:$port -showcerts 2>/dev/null | grep "Verify return code" | grep -c "ok")
      echo "certificate_chain_valid{service=\"$host\"} $chain_valid"

      # Get certificate details
      local cert_subject=$(echo | openssl s_client -connect $host:$port 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | cut -d= -f2-)
      echo "certificate_info{service=\"$host\",subject=\"$cert_subject\"} 1"

      # TLS handshake time
      local start=$(date +%s%N)
      echo | timeout 5 openssl s_client -connect $host:$port >/dev/null 2>&1
      local end=$(date +%s%N)
      local duration=$(( ($end - $start) / 1000000 ))
      echo "tls_handshake_duration_ms{service=\"$host\"} $duration"
    }

    # Generate metrics output
    (
      echo "# TLS/SSL Security Metrics"
      for service in $SERVICES; do
        collect_tls_metrics $service
      done
    ) > /tmp/tls_metrics.txt

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-metrics-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-metrics-collector
  template:
    metadata:
      labels:
        app: tls-metrics-collector
    spec:
      containers:
      - name: collector
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache curl openssl bash
          while true; do
            bash /etc/tls-metrics/tls-collector.sh
            sleep 300
          done
        ports:
        - containerPort: 9091
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /etc/tls-metrics
          readOnly: true
        env:
        - name: SERVICES
          value: "api-gateway:8443 payment-service:8443 order-service:8443"
        - name: TLS_METRICS_PORT
          value: "9091"
      volumes:
      - name: config
        configMap:
          name: tls-metrics-config

---
apiVersion: v1
kind: Service
metadata:
  name: tls-metrics-collector
  namespace: monitoring
  labels:
    app: tls-metrics-collector
spec:
  selector:
    app: tls-metrics-collector
  ports:
  - name: metrics
    port: 9091
    targetPort: 9091
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tls-dashboard
  namespace: monitoring
data:
  tls-dashboard.json: |
    {
      "dashboard": {
        "title": "TLS/SSL Security Overview",
        "panels": [
          {
            "title": "TLS Version Distribution",
            "targets": [
              {"expr": "tls_version_info"}
            ]
          },
          {
            "title": "Cipher Suite Strength",
            "targets": [
              {"expr": "cipher_suite_strength"}
            ]
          },
          {
            "title": "Certificate Chain Validation",
            "targets": [
              {"expr": "certificate_chain_valid"}
            ]
          },
          {
            "title": "TLS Handshake Duration (ms)",
            "targets": [
              {"expr": "tls_handshake_duration_ms"}
            ]
          },
          {
            "title": "Certificate Validation Failures",
            "targets": [
              {"expr": "rate(certificate_validation_failures_total[5m])"}
            ]
          }
        ]
      }
    }

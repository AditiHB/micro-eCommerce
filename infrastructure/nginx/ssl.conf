# TLS configuration: modern profile. TLS 1.2 and 1.3 only, AEAD ciphers with forward secrecy.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:secp384r1;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
# No static session-ticket key: a key that never rotates defeats forward secrecy, and a key file
# committed to a repository (as this one used to be) defeats it entirely.
ssl_session_tickets off;

# No DH parameters needed (ECDHE only) and no OCSP stapling: certificates come from a private CA
# (smallstep) and are short-lived (24h) and auto-renewed, so expiry - not revocation lists - is the
# revocation mechanism.

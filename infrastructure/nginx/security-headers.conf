# Nginx Security Headers Configuration
# Implements OWASP security header best practices

# Strict Transport Security (HSTS)
# Forces HTTPS for 1 year, including subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (CSP)
# Prevents XSS, clickjacking, and data injection attacks
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# X-Content-Type-Options
# Prevents MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-Frame-Options
# Prevents clickjacking attacks
add_header X-Frame-Options "DENY" always;

# X-XSS-Protection
# Legacy XSS protection (for older browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls how much referrer information is shared
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy (formerly Feature-Policy)
# Controls which browser features can be used
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), sync-xhr=(), usb=(), wake-lock=(), xr-spatial-tracking=()" always;

# Additional Security Headers
# Prevent caching of sensitive data
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# Prevent page from being displayed in a frame or iframe
add_header X-Permission-Policy "geolocation=(), microphone=(), camera=()" always;

# Server header - hide server information
server_tokens off;

# Disable dangerous HTTP methods
if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
  return 405;
}

# Disable TRACE and TRACK methods
if ($request_method ~ ^(TRACE|TRACK)$) {
  return 405;
}

# SSL/TLS Configuration
# Use only strong protocols
ssl_protocols TLSv1.2 TLSv1.3;

# Strong cipher suites (no weak ciphers)
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

# Prefer server cipher suites
ssl_prefer_server_ciphers on;

# Enable session resumption
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP stapling for certificate status validation
ssl_stapling on;
ssl_stapling_verify on;
ssl_stapling_responder "http://ocsp.digicert.com";
ssl_trusted_certificate /etc/nginx/certs/ocsp-chain.pem;

# Diffie-Hellman parameter for perfect forward secrecy
ssl_dhparam /etc/nginx/certs/dhparam.pem;

# Rate limiting for DDoS protection
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Connection limits
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn addr 10;

# Log format with security details
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$ssl_protocol" "$ssl_cipher" '
                    '$request_time $upstream_response_time';

access_log /var/log/nginx/access.log security;
error_log /var/log/nginx/error.log warn;

# Hide nginx version
add_header Server "" always;

# Disable unused HTTP methods
if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS)$) {
  return 405;
}

# Protect against path traversal attacks
if ($request_uri ~* "\.\.") {
  return 403;
}

# Protect sensitive files
location ~ /\. {
  deny all;
  access_log off;
  log_not_found off;
}

location ~ ~$ {
  deny all;
  access_log off;
  log_not_found off;
}

# Protect configuration files
location ~* ^/(.*)\.conf$ {
  deny all;
  access_log off;
  log_not_found off;
}

# Security validation for payment endpoints
location /api/payment {
  # Require POST only
  if ($request_method != POST) {
    return 405;
  }

  # Validate content-type
  if ($content_type !~ "application/json") {
    return 415;
  }

  # Apply strict rate limiting for auth
  limit_req zone=auth burst=1 nodelay;

  # Verify SSL/TLS
  if ($ssl_protocol = "") {
    return 403;
  }

  # No caching of payment data
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

# API rate limiting
location /api {
  limit_req zone=api burst=20 nodelay;
}

# General rate limiting
location / {
  limit_req zone=general burst=20 nodelay;
}

# Health check endpoint (no security headers needed)
location /health {
  return 200 "OK";
  add_header Content-Type "text/plain";
  access_log off;
}

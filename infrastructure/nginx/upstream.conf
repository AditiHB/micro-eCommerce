# Upstream backend service definitions
# All services communicate via HTTP internally (Nginx provides encryption)

# API Gateway upstream
upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Customer Service upstream
upstream customer_service {
    least_conn;
    server customer-service:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Order Service upstream
upstream order_service {
    least_conn;
    server order-service:8083 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Inventory Service upstream
upstream inventory_service {
    least_conn;
    server inventory-service:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Payment Service upstream
upstream payment_service {
    least_conn;
    server payment-service:8084 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

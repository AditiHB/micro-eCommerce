# Additional SSL security parameters
# Included from main nginx.conf

# Include the main SSL configuration
include /etc/nginx/ssl.conf;

# Additional security settings
ssl_verify_depth 2;
ssl_buffer_size 4k;

# Insecure protocols (SSLv2/v3, TLSv1/1.1) are already excluded by the
# `ssl_protocols TLSv1.2 TLSv1.3;` allowlist in ssl.conf above - nginx's
# ssl_protocols directive takes an allowlist, not a `-SSLv2`-style denylist.

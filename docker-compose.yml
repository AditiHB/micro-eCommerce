# ===============================================================================
# Single Compose file for ALL local scenarios - switch behavior with profiles
# and environment variables instead of maintaining separate compose files.
# This project is local-only (Docker Compose here, Kubernetes manifests under
# k8s/ for a cluster-based local run); there is no separate "production"
# compose file to keep in sync.
#
# FIRST RUN: no credential exists anywhere in this repository. Generate your own:
#        scripts/gen-env.sh            (creates a git-ignored .env of random secrets)
#
#   1) Entire core stack (PostgreSQL - the only database engine - and a single-node KRaft Kafka):
#        docker compose up -d --build
#
#   2) A replicated Kafka cluster (3 KRaft brokers, replication factor 3, min.insync.replicas 2):
#        docker compose -f docker-compose.yml -f docker-compose.kafka-ha.yml up -d --build
#      (see docs/RESILIENCE.md)
#
#   3) HTTPS locally via nginx. Certificates are issued by the internal smallstep CA:
#        docker compose -f docker-compose.yml -f docker-compose.pki.yml --profile https up -d
#      (see docs/SMALLSTEP_PKI.md)
#
#   4) Secrets served by HashiCorp Vault instead of the environment:
#        docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d
#      (see docs/VAULT_SECRETS.md)
#
#   5) Observability (ELK/Prometheus/Grafana), on top of any of the above:
#        add  --profile observability
#
# Identity: Keycloak (http://localhost:8180) issues every token. Services hold no passwords and
# share no signing secret - they verify RS256 tokens against Keycloak's published keys.
#
# Every published port is bound to 127.0.0.1: nothing here is reachable from your LAN.
# See SETUP_AND_DEPLOYMENT.md for the full matrix of scenarios.
# ===============================================================================

# --- shared environment blocks ---------------------------------------------------------------
x-platform-env: &platform-env
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
  # The registry requires HTTP Basic credentials (see infrastructure/discovery-server).
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:?run scripts/gen-env.sh}@discovery-server:8761/eureka/"
  # How tokens are verified. The issuer is the PUBLIC url Keycloak stamps into tokens; the JWKS is
  # fetched over the internal network.
  SECURITY_JWK_SET_URI: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
  SECURITY_ISSUER: "http://localhost:8180/realms/ecommerce"
  SECURITY_AUDIENCE: "ecommerce-api"

x-business-env: &business-env
  <<: *platform-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}"
  # Topic durability. 1/1 for the single-node dev broker; docker-compose.kafka-ha.yml sets 3/2.
  KAFKA_EVENT_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
  KAFKA_EVENT_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-1}"
  # PostgreSQL is the only database engine; each service has its own database and owner role below.
  DB_HOST: "postgres"
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-}"

# Services that cache reference data (customer, inventory - for its catalogue) also get the shared Redis.
x-cached-env: &cached-env
  <<: *business-env
  REDIS_HOST: "redis"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?run scripts/gen-env.sh}"

services:
  # ---------------------------------------------------------------------------
  # Core stack (always runs with a plain `docker compose up -d`). Sized for a
  # resource-constrained laptop (~12GB RAM, no dedicated GPU): every JVM-based
  # service gets both a container memory cap (mem_limit) AND an explicit heap
  # cap (JAVA_TOOL_OPTIONS / *_HEAP_OPTS), because without the latter the JVM
  # only auto-sizes default heap as a fraction of the container limit - still
  # leaving it free to grow metaspace/off-heap into the rest, right up to the
  # point the kernel OOM-kills the container instead of the JVM GC'ing cleanly.
  # ---------------------------------------------------------------------------
  # Single-node KRaft Kafka (no ZooKeeper). Every topic is declared by the services themselves at startup
  # (KafkaAdmin, generated from the @EventSchema catalog), so broker auto-creation is OFF: a typo in a topic name
  # fails loudly instead of silently creating a new, un-replicated topic.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "ZWNvbW1lcmNlLWRldi1rcmFmdA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx320m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 640m
    mem_reservation: 320m

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    # Authentication is mandatory: the cache holds customer data and the gateway's rate-limit counters.
    command: >
      redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:?run scripts/gen-env.sh}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?run scripts/gen-env.sh}"
    mem_limit: 64m
    mem_reservation: 32m

  # ---------------------------------------------------------------------------
  # Identity provider. Issues every access token; services only verify them.
  # `start-dev` keeps local startup fast and stores its data in a named volume. A real deployment runs
  # `start --optimized` against Postgres behind TLS (see k8s/overlays/secure).
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:?run scripts/gen-env.sh}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      # Tokens carry the public URL as issuer; the backchannel (JWKS, token endpoint) stays reachable
      # by its internal name, which is why services configure the two separately.
      KC_HOSTNAME: "http://localhost:8180"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      # Substituted into realm-ecommerce.json at import time; the realm file itself holds no secret.
      NOTIFICATION_CLIENT_SECRET: "${NOTIFICATION_CLIENT_SECRET:?run scripts/gen-env.sh}"
    volumes:
      - ./infrastructure/keycloak/realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 768m
    mem_reservation: 512m

  # One-shot: development-only identities (a password-grant client for scripts/Karate, one user per
  # role). Never part of the realm file, so they cannot leak into a real deployment.
  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak-seed
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/seed-dev.sh"]
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:?run scripts/gen-env.sh}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      E2E_CLIENT_SECRET: "${E2E_CLIENT_SECRET:?run scripts/gen-env.sh}"
      E2E_ADMIN_PASSWORD: "${E2E_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      E2E_MANAGER_PASSWORD: "${E2E_MANAGER_PASSWORD:?run scripts/gen-env.sh}"
      E2E_USER_PASSWORD: "${E2E_USER_PASSWORD:?run scripts/gen-env.sh}"
    volumes:
      - ./infrastructure/keycloak/seed-dev.sh:/seed-dev.sh:ro
    restart: "no"
    mem_limit: 256m

  config-server:
    build:
      context: .
      dockerfile: Dockerfile.config-server
    container_name: config-server
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "file:///config-repo"
      CONFIG_SERVER_PASSWORD: "${CONFIG_SERVER_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx160m"
    mem_limit: 320m
    mem_reservation: 160m

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.discovery-server
    container_name: discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_USERNAME: "${EUREKA_USERNAME:-eureka}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx160m"
    mem_limit: 384m
    mem_reservation: 192m

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - config-server
      - discovery-server
      - redis
    environment:
      <<: *platform-env
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?run scripts/gen-env.sh}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m"
    mem_limit: 448m
    mem_reservation: 224m

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile.customer-service
    container_name: customer-service
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *cached-env
      DB_USERNAME: "customer_owner"
      DB_PASSWORD: "${CUSTOMER_DB_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m"
    mem_limit: 512m
    mem_reservation: 256m

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.inventory-service
    # container_name removed to allow scaling without name conflicts
    # ports removed/changed so multiple instances don't fight for host port 8082
    # External traffic should route through api-gateway anyway
    expose:
      - "8082"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *cached-env
      DB_USERNAME: "inventory_owner"
      DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m"
    mem_limit: 512m
    mem_reservation: 256m

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order-service
    container_name: order-service
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *business-env
      CATALOG_SERVICE_URL: "http://inventory-service:8082"
      CUSTOMER_SERVICE_URL: "http://customer-service:8081"
      DB_USERNAME: "order_owner"
      DB_PASSWORD: "${ORDER_DB_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m"
    mem_limit: 512m
    mem_reservation: 256m

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment-service
    container_name: payment-service
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *business-env
      DB_USERNAME: "payment_owner"
      DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?run scripts/gen-env.sh}"
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m"
    mem_limit: 512m
    mem_reservation: 256m

  # product-service was merged into inventory-service: the catalogue is now served from inventory_db above,
  # at the same /api/v1/products routes, so there is no separate product-service container here any more.

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_started
    environment:
      <<: *business-env
      CUSTOMER_SERVICE_URL: "http://customer-service:8081"
      NOTIFICATION_CHANNEL: "log"
      DB_USERNAME: "notification_owner"
      DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?run scripts/gen-env.sh}"
      # Machine identity (OAuth2 client credentials) for its one outbound call, to customer-service.
      KEYCLOAK_TOKEN_URI: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/token"
      NOTIFICATION_CLIENT_ID: "notification-service"
      NOTIFICATION_CLIENT_SECRET: "${NOTIFICATION_CLIENT_SECRET:?run scripts/gen-env.sh}"
      # Slightly more heap than its sibling services: it runs 4 Kafka consumer
      # groups (order/payment/inventory DLQ handlers + the main listener)
      # concurrently in one JVM.
      JAVA_TOOL_OPTIONS: "-Xms112m -Xmx224m"
    mem_limit: 640m
    mem_reservation: 320m

  # ---------------------------------------------------------------------------
  # PostgreSQL - the only database engine. One database and one owner role per service (see
  # infrastructure/postgres/init-multiple-postgres-databases.sh), so a compromised service can only touch its own
  # data. Flyway runs automatically on service startup; there is no separate manual "migrate" command. Data
  # survives restarts in the postgres-data volume.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      POSTGRES_MULTIPLE_DATABASES: customer_db,inventory_db,order_db,payment_db,notification_db
      CUSTOMER_DB_PASSWORD: "${CUSTOMER_DB_PASSWORD:?run scripts/gen-env.sh}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?run scripts/gen-env.sh}"
      ORDER_DB_PASSWORD: "${ORDER_DB_PASSWORD:?run scripts/gen-env.sh}"
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?run scripts/gen-env.sh}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?run scripts/gen-env.sh}"
      # Only used by docker-compose.vault.yml: the login Vault uses to mint short-lived DB roles.
      VAULT_DB_ADMIN_PASSWORD: "${VAULT_DB_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    mem_reservation: 160m

  # ---------------------------------------------------------------------------
  # Nginx HTTPS termination (opt-in). Forwards /api/ to the gateway. It needs a
  # certificate and key in infrastructure/nginx/certs/ - none are committed. The
  # supported way to get them is the smallstep CA overlay:
  #   docker compose -f docker-compose.yml -f docker-compose.pki.yml --profile https up -d
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: nginx
    profiles: ["https"]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
      - config-server
      - discovery-server
    mem_limit: 64m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Observability stack (ELK + Prometheus/Grafana). NOT started by default -
  # `docker compose up -d` skips everything below. On a 12GB laptop this is
  # nearly as expensive as the whole application, and it's not needed to
  # develop or test the app - only to look at logs in Kibana or dashboards in
  # Grafana. Start it explicitly when you actually want that:
  #   docker compose --profile observability up -d
  # Total observability budget if enabled: ~3GB (on top of the core ~3.8GB).
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    profiles: ["observability"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1024m
    mem_reservation: 512m

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: logstash
    profiles: ["observability"]
    volumes:
      - ./infrastructure/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "127.0.0.1:50000:50000"
    environment:
      - "LS_JAVA_OPTS=-Xms192m -Xmx256m"
    depends_on:
      - elasticsearch
    mem_limit: 768m
    mem_reservation: 384m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    mem_limit: 640m
    mem_reservation: 320m

  # Monitoring Stack - Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    secrets:
      - eureka_password
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - api-gateway
      - customer-service
      - inventory-service
      - order-service
      - payment-service
    mem_limit: 256m
    mem_reservation: 128m

  # Monitoring Stack - Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      # Dashboard JSONs live under a separate path from the provider config
      # above - mounting both a file AND the whole directory at
      # /etc/grafana/provisioning/dashboards causes Docker to create a stray
      # empty dashboards.yml on the host due to the overlapping bind mounts.
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run scripts/gen-env.sh}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
      - elasticsearch
    mem_limit: 128m
    mem_reservation: 64m

  # Monitoring Stack - Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./monitoring/alertmanager-templates.tmpl:/etc/alertmanager/templates/notifications.tmpl
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    mem_limit: 64m
    mem_reservation: 32m

  # Monitoring Stack - Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: node-exporter
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    mem_limit: 32m
    mem_reservation: 16m

  # Monitoring Stack - Elasticsearch Exporter
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.5.0
    container_name: elasticsearch-exporter
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9114:9114"
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
    command:
      - '--es.uri=http://elasticsearch:9200'
    depends_on:
      - elasticsearch
    expose:
      - "9114"
    mem_limit: 32m
    mem_reservation: 16m

  # Monitoring Stack - Loki for log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    mem_limit: 128m
    mem_reservation: 64m

# Prometheus reads the Eureka password from a file, never from its config.
secrets:
  eureka_password:
    environment: EUREKA_PASSWORD

volumes:
  kafka-data:
  postgres-data:
    driver: local
  keycloak-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  loki-data:
    driver: local

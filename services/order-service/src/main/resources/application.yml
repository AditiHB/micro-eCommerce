# This file stays a COMPLETE, self-sufficient set of defaults, not trimmed down to "bootstrap-only":
# the config-server import below is optional (tolerant of an unreachable server) everywhere except where
# SPRING_CLOUD_CONFIG_FAILFAST=true makes it mandatory (Compose/Kubernetes - see docs/CONFIG_SERVER.md).
# Whenever config-server IS reachable, its values from config-repo/order-service.yml + the global
# config-repo/application*.yml override everything here; this file is what a bare `mvn spring-boot:run`
# or a test slice with no profile active still runs on.
server:
  port: 8083
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: order-service
  autoconfigure:
    # Only customer-service and inventory-service cache (reference data); the others do not use Redis at all.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:}
      # false by default (bare local runs, test slices with no profile active) - Compose/k8s set
      # SPRING_CLOUD_CONFIG_FAILFAST=true so a real environment's unreachable config-server is a hard
      # failure instead of a silent fallback to these local defaults; optional: above only governs
      # Boot's own "resource not found" tolerance, which fail-fast deliberately overrides.
      fail-fast: ${SPRING_CLOUD_CONFIG_FAILFAST:false}
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5
    vault:
      # Switched on by the `vault` profile (see application-vault.yml); off for plain local runs.
      enabled: false
  config:
    import: "optional:configserver:http://localhost:8888/"
  flyway:
    # Schema changes run as a separate owner role when one is provided (Vault mode); otherwise they
    # fall back to the application role.
    user: ${db.migration.username:${vault.db.username:${DB_USERNAME:}}}
    password: ${db.migration.password:${vault.db.password:${DB_PASSWORD:}}}
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration/postgresql
    outOfOrder: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # (De)serialization is configured in KafkaEventConfig: logical event types, an allow-list of classes.
      group-id: order-group
  datasource:
    # PostgreSQL is the only database engine. Credentials come from the environment, or from Vault as
    # short-lived dynamic credentials when the vault profile is on.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    # No lazy loading in the web layer: every response is built from DTOs inside a service transaction.
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  batch:
    jdbc:
      # EMBEDDED (the default) is exactly right here: Spring Boot self-initializes the batch schema for
      # H2 (embedded) and does nothing for Postgres, where V12__Spring_Batch_Schema.sql (this service's
      # own Flyway migration) owns it instead - the same split this service already uses for every other
      # table.
      initialize-schema: embedded
    job:
      # This service's invoiceGenerationJob is launched only by InvoiceJobScheduler, on a schedule - not
      # by Spring Boot's JobLauncherApplicationRunner at every startup.
      enabled: false

# Resilience is applied only where it is safe and useful: to READS of other services (the catalogue and the
# customer directory). Creating an order is a local database write and is deliberately not retried - safety
# there comes from the Idempotency-Key. Timeouts nest from the edge inward (gateway 10s > this service
# 8s > one remote call ~3.2s worst case); see docs/RESILIENCE.md.
resilience4j:
  retry:
    instances:
      catalog: &remote-read-retry
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      customerDirectory: *remote-read-retry
  circuitbreaker:
    instances:
      catalog: &remote-read-breaker
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      customerDirectory: *remote-read-breaker

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ecommerce:
  clients:
    connect-timeout: 500ms
    read-timeout: 1500ms
  orders:
    saga-timeout: ${ORDER_SAGA_TIMEOUT:5m}
    idempotency-key-required: ${ORDER_IDEMPOTENCY_KEY_REQUIRED:false}
  invoices:
    poll-interval: ${INVOICE_POLL_INTERVAL:PT1M}
  service-auth:
    # This service's own machine identity (OAuth2 client credentials): the invoice batch job has no
    # caller token to relay, unlike this service's request-scoped CustomerDirectoryClient. No default
    # for the secret.
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}
    client-id: ${ORDER_CLIENT_ID:order-service}
    client-secret: ${ORDER_CLIENT_SECRET:}
  invoice-signing:
    # RSA keypair that signs/verifies every generated invoice PDF. Base64 DER, not PEM - see
    # InvoiceSigningProperties. No default for either half.
    private-key: ${INVOICE_SIGNING_PRIVATE_KEY:}
    public-key: ${INVOICE_SIGNING_PUBLIC_KEY:}
  invoice-download:
    # RSA keypair the invoice download endpoint encrypts (JWE) with. A single platform-wide keypair -
    # see the Javadoc on OrderController#downloadInvoice.
    rsa-private-key: ${INVOICE_DOWNLOAD_PRIVATE_KEY:}
    rsa-public-key: ${INVOICE_DOWNLOAD_PUBLIC_KEY:}
  security:
    # Identity provider (Keycloak). URLs are public configuration, not secrets; there is deliberately
    # no signing secret anywhere any more - tokens are RS256 and verified against the provider's JWKS.
    jwk-set-uri: ${SECURITY_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
    issuer: ${SECURITY_ISSUER:http://localhost:8180/realms/ecommerce}
    audience: ${SECURITY_AUDIENCE:ecommerce-api}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9083}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

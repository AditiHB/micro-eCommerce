spring:
  application:
    name: order-service-test
  liquibase:
    enabled: false
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  kafka:
    admin:
      auto-create: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  listener:
    auto-startup: false

server:
  port: 8082

logging:
  level:
    root: WARN
    com.ecommerce: WARN

jwt:
  secret: testSecretKeyForJWTTokenSigningPurposeOnlyForTesting1234567890
  expiration: 3600000

eureka:
  client:
    enabled: false

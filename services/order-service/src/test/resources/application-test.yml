# Integration-test profile. The datasource comes from the shared Testcontainers PostgreSQL (see
# common's SharedPostgres), the real Flyway migrations run, and Hibernate validates the entities against them.
spring:
  application:
    name: order-service-test
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false
  # Spring Cloud Stream/Bus's own autoconfiguration (not just spring.cloud.bus.enabled, which only gates
  # the refresh-listener wiring - the binding/binder machinery activates regardless of it) is excluded
  # entirely: left active, it eagerly resolves the Kafka binder at context startup and its AdminClient
  # retries reaching localhost:9092 (its own built-in default - config-server is disabled here too, so it
  # never even sees the real broker address) for the life of the test, as pure log noise and ~5x slower
  # context startup. Confirmed empirically: a test that took ~75s and logged ~500 of these warnings with
  # only "bus.enabled: false" set drops to ~13s and zero warnings with this full exclude list.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.cloud.bus.BusAutoConfiguration
      - org.springframework.cloud.bus.BusRefreshAutoConfiguration
      - org.springframework.cloud.bus.BusStreamAutoConfiguration
      - org.springframework.cloud.bus.PathServiceMatcherAutoConfiguration
      - org.springframework.cloud.bus.jackson.BusJacksonAutoConfiguration
      - org.springframework.cloud.stream.config.BindersHealthIndicatorAutoConfiguration
      - org.springframework.cloud.stream.config.ChannelsEndpointAutoConfiguration
      - org.springframework.cloud.stream.config.BindingsEndpointAutoConfiguration
      - org.springframework.cloud.stream.config.BindingServiceConfiguration
      - org.springframework.cloud.stream.function.FunctionConfiguration
  kafka:
    admin:
      auto-create: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

kafka:
  listener:
    auto-startup: false

ecommerce:
  outbox:
    # Tests inspect the outbox rows instead of letting a relay ship them.
    relay-enabled: false
  orders:
    reaper-enabled: false
  invoices:
    # Tests launch invoiceGenerationJob directly (JobLauncherTestUtils) instead of waiting on the scheduler.
    enabled: false
  service-auth:
    # Tests never contact an identity provider; a test that does exercise InvoiceCustomerClient mocks it.
    token-uri: http://localhost:0/token
    client-id: order-service-test
    client-secret: test-only-client-secret
  invoice-signing:
    # Test-only RSA-2048 keypair (base64 DER, PKCS#8 private / X.509 SubjectPublicKeyInfo public),
    # never used outside this test profile.
    private-key: 
    public-key: 
  invoice-download:
    # A second, independent test-only keypair (base64 DER, PKCS#8/X.509) for the download endpoint's JWE.
    rsa-private-key: 
    rsa-public-key: 
  security:
    # Tests never contact an identity provider: JwtDecoder is built lazily and slice tests use mock tokens.
    jwk-set-uri: http://localhost:0/jwks
    issuer: http://issuer.test/realms/ecommerce
    audience: ecommerce-api

server:
  port: 8082

logging:
  level:
    root: WARN
    com.ecommerce: WARN

eureka:
  client:
    enabled: false

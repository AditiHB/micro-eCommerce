server:
  port: 8082
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: file:/etc/certs/inventory-service/tls.crt
    key-store-password: changeit
    key-alias: inventory-service
    client-auth: need

spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:https://config-server.ecommerce.svc.cluster.local:8888/"
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration/{vendor}
    outOfOrder: false
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  datasource:
    url: jdbc:h2:mem:inventory_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
  redis:
    host: redis
    port: 6379
    database: 2
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000
      key-prefix: "inventory-service:"

services:
  order:
    url: https://order-service.ecommerce.svc.cluster.local:8083

rest-client:
  connect-timeout: 10000
  read-timeout: 30000
  socket-timeout: 30000

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 2s

eureka:
  client:
    service-url:
      defaultZone: https://discovery-server.ecommerce.svc.cluster.local:8761/eureka/
    secure-port-enabled: true
    instance:
      prefer-ip-address: false
      hostname: inventory-service.ecommerce.svc.cluster.local

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: kubernetes
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# This file stays a COMPLETE, self-sufficient set of defaults, not trimmed down to "bootstrap-only":
# the config-server import below is optional (tolerant of an unreachable server) everywhere except where
# SPRING_CLOUD_CONFIG_FAILFAST=true makes it mandatory (Compose/Kubernetes - see docs/CONFIG_SERVER.md).
# Whenever config-server IS reachable, its values from config-repo/notification-service.yml + the global
# config-repo/application*.yml override everything here; this file is what a bare `mvn spring-boot:run`
# or a test slice with no profile active still runs on.
server:
  port: 8086
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: notification-service
  autoconfigure:
    # Only customer-service and inventory-service cache (reference data); the others do not use Redis at all.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:}
      # false by default (bare local runs, test slices with no profile active) - Compose/k8s set
      # SPRING_CLOUD_CONFIG_FAILFAST=true so a real environment's unreachable config-server is a hard
      # failure instead of a silent fallback to these local defaults; optional: above only governs
      # Boot's own "resource not found" tolerance, which fail-fast deliberately overrides.
      fail-fast: ${SPRING_CLOUD_CONFIG_FAILFAST:false}
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.5
    vault:
      # Switched on by the `vault` profile (see application-vault.yml); off for plain local runs.
      enabled: false
  config:
    import: "optional:configserver:http://localhost:8888/"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  flyway:
    # Schema changes run as a separate owner role when one is provided (Vault mode); otherwise they
    # fall back to the application role.
    user: ${db.migration.username:${vault.db.username:${DB_USERNAME:}}}
    password: ${db.migration.password:${vault.db.password:${DB_PASSWORD:}}}
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration/postgresql
    outOfOrder: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # (De)serialization is configured in KafkaEventConfig: logical event types, an allow-list of classes.
      group-id: notification-group
  datasource:
    # PostgreSQL is the only database engine. Credentials come from the environment, or from Vault as
    # short-lived dynamic credentials when the vault profile is on.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    # No lazy loading in the web layer: every response is built from DTOs inside a service transaction.
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

# Notification delivery channel: "log" simulates sending (default, no SMTP
# server required) or "email" sends real SMTP email via spring.mail.* above.
notification:
  channel: ${NOTIFICATION_CHANNEL:log}
  email:
    from: ${NOTIFICATION_FROM_EMAIL:no-reply@ecommerce.local}

# The one service Notification Service calls over REST: the customer directory, for the recipient's email.
# (Order-service is no longer called - the saga events carry the customer id.) The call is a read, so it is
# retried a little and circuit-broken; a failure propagates to the event consumer, which retries with backoff and
# then dead-letters - it is never turned into "no customer".
services:
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

resilience4j:
  retry:
    instances:
      customerService:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      customerService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ecommerce:
  clients:
    connect-timeout: 500ms
    read-timeout: 1500ms
  notifications:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  security:
    # Identity provider (Keycloak). URLs are public configuration, not secrets; there is deliberately
    # no signing secret anywhere any more - tokens are RS256 and verified against the provider's JWKS.
    jwk-set-uri: ${SECURITY_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
    issuer: ${SECURITY_ISSUER:http://localhost:8180/realms/ecommerce}
    audience: ${SECURITY_AUDIENCE:ecommerce-api}
  service-auth:
    # This service's own machine identity (OAuth2 client credentials). No default for the secret.
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}
    client-id: ${NOTIFICATION_CLIENT_ID:notification-service}
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9086}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

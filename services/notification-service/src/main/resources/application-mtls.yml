# Mutual TLS between backend services - see docs/SMALLSTEP_PKI.md section 11.
#
# notification-service is a one-way exception: nothing in the mesh calls it (the gateway has an
# lb://notification-service route configured, but this service's actual, documented reachability
# is direct and external - the same port Postman/Insomnia/the e2e suite use by default, see
# e2e-tests/README.md). Requiring a client certificate on its inbound side would block that
# external access for no mesh benefit, since no internal caller depends on it either way. So this
# profile does NOT set server.ssl here - the main port stays plain HTTP, unchanged.
#
# What this service DOES need is the "mtls" bundle as a CLIENT identity for CustomerClient's one
# real outbound call to customer-service, which does require a client certificate.
spring:
  ssl:
    bundle:
      pem:
        mtls:
          reload-on-update: true
          keystore:
            certificate: file:/certs/notification-service/tls.crt
            private-key: file:/certs/notification-service/tls.key
          truststore:
            certificate: ${ECOMMERCE_SECURITY_MTLS_TRUSTSTORE:file:/certs/ca/ca-bundle.crt}

# CustomerClient's outbound call to customer-service. OrderClient is dead code
# (the saga no longer calls order-service directly - see its own javadoc), so
# services.order.url is unused; left out rather than carried forward wrong.
services:
  customer:
    url: https://customer-service:8081

# Mutual TLS between backend services - see docs/SMALLSTEP_PKI.md section 11.
# Layers onto whatever profile is already active (e.g. "postgres,mtls"); it does not
# repeat datasource/Kafka/Redis/logging config that belongs to that profile already.
#
# Serves TLS on the main server port and requires a client certificate from every
# caller. The management port (actuator/probes) is untouched and stays plain HTTP -
# Spring Boot only applies TLS to the separate management server if management.server.ssl
# is set, which it isn't here, so k8s liveness/readiness probes are unaffected.
server:
  ssl:
    bundle: mtls
    client-auth: need

# Confirmed live: Spring Boot's separate management server inherits server.ssl by default when
# management.server.ssl isn't set at all, even on its own port - it does NOT default to plain HTTP
# the way a first read of the docs suggests. Without this, the management port's actuator health
# endpoint (what every k8s liveness/readiness probe hits) would also demand a client certificate.
management:
  server:
    ssl:
      enabled: false

spring:
  ssl:
    bundle:
      pem:
        mtls:
          reload-on-update: true
          keystore:
            certificate: file:/certs/customer-service/tls.crt
            private-key: file:/certs/customer-service/tls.key
          truststore:
            certificate: ${ECOMMERCE_SECURITY_MTLS_TRUSTSTORE:file:/certs/ca/ca-bundle.crt}

# Eureka must advertise a stable hostname that appears in the certificate's SANs,
# never a pod IP (dynamic, can't be in a static cert) - and must say this instance
# only speaks TLS, so the gateway's lb://customer-service route resolves to
# https://customer-service:8081 instead of http://<pod-ip>:8081. The bare service
# name resolves the same way under Docker Compose (container name) and Kubernetes
# (same-namespace Service name), so this file needs no per-environment branching.
# instance-id includes POD_NAME (Kubernetes Downward API; falls back to a random
# value under Compose) so replicas sharing one hostname+port don't collapse into a
# single Eureka registration.
eureka:
  instance:
    prefer-ip-address: false
    hostname: customer-service
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: ${server.port}
    instance-id: ${spring.application.name}:${POD_NAME:${random.value}}

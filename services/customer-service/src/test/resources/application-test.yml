spring:
  application:
    name: customer-service-test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8081

logging:
  level:
    root: WARN
    com.ecommerce: INFO

jwt:
  secret: testSecretKeyForJWTTokenSigningPurposeOnlyForTesting1234567890
  expiration: 3600000

# Integration-test profile. The datasource comes from the shared Testcontainers PostgreSQL (see
# common's SharedPostgres), the real Flyway migrations run, and Hibernate validates the entities against them.
spring:
  application:
    name: customer-service-test
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false
  data:
    redis:
      # Nothing listens here by default: tests that do not need a cache run through the cache-outage path
      # (every cache call fails fast and is treated as a miss). The cache tests point this at a real Redis.
      host: localhost
      port: 6399
      timeout: 500ms
  kafka:
    admin:
      auto-create: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

kafka:
  listener:
    auto-startup: false

ecommerce:
  outbox:
    # Tests inspect the outbox rows instead of letting a relay ship them.
    relay-enabled: false
  security:
    # Tests never contact an identity provider: JwtDecoder is built lazily and slice tests use mock tokens.
    jwk-set-uri: http://localhost:0/jwks
    issuer: http://issuer.test/realms/ecommerce
    audience: ecommerce-api

server:
  port: 8081

logging:
  level:
    root: WARN
    com.ecommerce: WARN

eureka:
  client:
    enabled: false

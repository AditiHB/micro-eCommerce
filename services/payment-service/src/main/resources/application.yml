server:
  port: 8084
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: payment-service
  autoconfigure:
    # Only customer-service and product-service cache (reference data); the others do not use Redis at all.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
  cloud:
    vault:
      # Switched on by the `vault` profile (see application-vault.yml); off for plain local runs.
      enabled: false
  config:
    import: "optional:configserver:http://localhost:8888/"
  flyway:
    # Schema changes run as a separate owner role when one is provided (Vault mode); otherwise they
    # fall back to the application role.
    user: ${db.migration.username:${vault.db.username:${DB_USERNAME:}}}
    password: ${db.migration.password:${vault.db.password:${DB_PASSWORD:}}}
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration/postgresql
    outOfOrder: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # (De)serialization is configured in KafkaEventConfig: logical event types, an allow-list of classes.
      group-id: payment-group
  datasource:
    # PostgreSQL is the only database engine. Credentials come from the environment, or from Vault as
    # short-lived dynamic credentials when the vault profile is on.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    # No lazy loading in the web layer: every response is built from DTOs inside a service transaction.
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

payments:
  gateway:
    # "simulated" is a development stand-in; a real processor implements PaymentGateway and is selected here.
    type: ${PAYMENT_GATEWAY_TYPE:simulated}
  simulator:
    # The stand-in declines any charge above this amount, so declines can be exercised end to end.
    decline-above: ${PAYMENT_SIMULATOR_DECLINE_ABOVE:10000.00}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ecommerce:
  security:
    # Identity provider (Keycloak). URLs are public configuration, not secrets; there is deliberately
    # no signing secret anywhere any more - tokens are RS256 and verified against the provider's JWKS.
    jwk-set-uri: ${SECURITY_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
    issuer: ${SECURITY_ISSUER:http://localhost:8180/realms/ecommerce}
    audience: ${SECURITY_AUDIENCE:ecommerce-api}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9084}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

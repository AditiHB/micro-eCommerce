spring:
  application:
    name: payment-service-test
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

logging:
  level:
    root: WARN
    com.ecommerce: INFO

kafka:
  listener:
    auto-startup: false


jwt:
  secret: testSecretKeyForJWTTokenSigningPurposeOnlyForTesting1234567890
  expiration: 3600000

# Integration-test profile. The datasource comes from the shared Testcontainers PostgreSQL (see
# common's SharedPostgres), the real Flyway migrations run, and Hibernate validates the entities against them.
spring:
  application:
    name: payment-service-test
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false
    bus:
      # Otherwise Spring Cloud Bus eagerly registers its own Kafka binding at context startup,
      # which forces the binder's AdminClient to repeatedly try reaching localhost:9092 (its own
      # built-in default - config-server is disabled here too, so it never even sees the real
      # broker address) for the life of the test, purely as log noise.
      enabled: false
  kafka:
    admin:
      auto-create: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

kafka:
  listener:
    auto-startup: false

ecommerce:
  outbox:
    # Tests inspect the outbox rows instead of letting a relay ship them.
    relay-enabled: false
  security:
    # Tests never contact an identity provider: JwtDecoder is built lazily and slice tests use mock tokens.
    jwk-set-uri: http://localhost:0/jwks
    issuer: http://issuer.test/realms/ecommerce
    audience: ecommerce-api

server:
  port: 8085

logging:
  level:
    root: WARN
    com.ecommerce: WARN

eureka:
  client:
    enabled: false

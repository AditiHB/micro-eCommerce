# Per-app, all profiles.
server:
  port: 8086

spring:
  autoconfigure:
    # Only customer-service and inventory-service cache (reference data); the others do not use Redis at all.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  kafka:
    consumer:
      group-id: notification-group
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

# Notification delivery channel: "log" simulates sending (default, no SMTP server required) or "email" sends
# real SMTP email via spring.mail.* above.
notification:
  channel: ${NOTIFICATION_CHANNEL:log}
  email:
    from: ${NOTIFICATION_FROM_EMAIL:no-reply@ecommerce.local}

# The one service notification-service calls over REST: the customer directory, for the recipient's email.
# The call is a read, so it is retried a little and circuit-broken; a failure propagates to the event
# consumer, which retries with backoff and then dead-letters.
services:
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

resilience4j:
  retry:
    instances:
      customerService:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      customerService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

ecommerce:
  clients:
    connect-timeout: 500ms
    read-timeout: 1500ms
  notifications:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  service-auth:
    # This service's own machine identity (OAuth2 client credentials). No default for the secret.
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}
    client-id: ${NOTIFICATION_CLIENT_ID:notification-service}
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9086}

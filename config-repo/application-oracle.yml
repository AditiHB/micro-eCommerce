# Global, oracle profile: identical across customer/order/inventory/payment/notification-service, including
# the datasource URL - unlike postgres, every service shares the same Oracle SID (ORDB) and is differentiated
# only by its own DB_USERNAME/schema, which was already a placeholder, so there is no per-service override file
# for this profile at all.
spring:
  flyway:
    user: ${db.migration.username:${vault.db.username:${DB_USERNAME:}}}
    password: ${db.migration.password:${vault.db.password:${DB_PASSWORD:}}}
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/ORDB
    driverClassName: oracle.jdbc.driver.OracleDriver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

logging:
  level:
    org.hibernate.SQL: INFO

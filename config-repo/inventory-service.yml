# Per-app, all profiles.
server:
  port: 8082

spring:
  kafka:
    consumer:
      group-id: inventory-group
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      # The catalogue cache (merged in from product-service) - stock itself is never cached.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 600000

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}

# notification-service is a one-way exception: nothing in the mesh calls it (the gateway has an
# lb://notification-service route configured, but this service's actual, documented reachability is direct
# and external - the same port Postman/Insomnia/the e2e suite use by default, see e2e-tests/README.md).
# Requiring a client certificate on its inbound side would block that external access for no mesh benefit,
# since no internal caller depends on it either way. So this file does NOT set server.ssl - the main port
# stays plain HTTP, unchanged. (The global application-mtls.yml's SSL bundle wiring still applies to this
# service - it's used as a CLIENT identity for CustomerClient's one real outbound call to customer-service,
# which does require a client certificate.)
services:
  customer:
    url: https://customer-service:8081

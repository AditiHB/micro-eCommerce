# Per-app, all profiles. This is what customer-service answers differently from every other client -
# everything else (actuator shape, logging, Eureka URL template, JWK/issuer/audience, Flyway, Kafka broker,
# vault.enabled default) comes from the global application.yml.
#
# The datasource block below is the real default for a plain `docker compose up` (no named Spring profile
# is active there - SPRING_PROFILES_ACTIVE defaults to empty - so these unconditional values are what's
# actually used; application-postgres.yml only adds its production tuning on top when "postgres" is
# explicitly named, e.g. the Kubernetes postgres overlay).
server:
  port: 8081

spring:
  kafka:
    consumer:
      group-id: customer-group
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/customer_db}
    driverClassName: org.postgresql.Driver
    username: ${vault.db.username:${DB_USERNAME:}}
    password: ${vault.db.password:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 600000

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}

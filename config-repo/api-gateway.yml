# Per-app, all profiles. api-gateway doesn't share most of the business services' shape (no datasource, its
# own Redis pool flavor, a much larger actuator exposure list for the circuit-breaker dashboard) - almost
# everything it needs is genuinely its own rather than centralizable.
server:
  port: 8080
  http2:
    enabled: true

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      password: ${REDIS_PASSWORD:}
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
  cloud:
    gateway:
      # Only the explicit routes below exist. The discovery locator used to publish every registered
      # service at /<service-id>/** - unfiltered, bypassing the rate limiter and circuit breaker.
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Idempotency-Key
            allow-credentials: false
      # Timeouts nest from the edge inward (see docs/RESILIENCE.md): the caller's time limiter (10s) is the
      # outermost bound, the gateway's own response timeout (9s) fires just before it, and the services finish
      # inside 8s. There is deliberately NO Retry filter on any route - a gateway that retried POST /orders
      # would create duplicate orders; retries belong to the client (with an Idempotency-Key) and to
      # idempotent reads.
      httpclient:
        connect-timeout: 1000
        response-timeout: 9s
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 100

        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 150

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 200

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 50

        # The catalogue (served by inventory-service - product-service was merged into it)
        - id: product-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalogCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 200

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 100

        - id: order-service-legacy
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/orders>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 100

        - id: customer-service-legacy
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/customers>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 150

        - id: inventory-service-legacy
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/inventory>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: inventoryCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 200

        - id: payment-service-legacy
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/payments>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 50

        - id: product-service-legacy
          uri: lb://inventory-service
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/products>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: catalogCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 200

        - id: notification-service-legacy
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/$\{segment}
            - AddResponseHeader=Deprecation, true
            - AddResponseHeader=Link, </api/v1/notifications>; rel="successor-version"
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/service
            - name: RateLimitingFilter
              args:
                requestsPerMinute: 100

        - id: order-service-dead-letters
          uri: lb://order-service
          predicates:
            - Path=/api/v1/admin/order/dead-letters/**
          filters:
            - RewritePath=/api/v1/admin/order/(?<segment>.*), /api/v1/$\{segment}
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/service

        - id: inventory-service-dead-letters
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/admin/inventory/dead-letters/**
          filters:
            - RewritePath=/api/v1/admin/inventory/(?<segment>.*), /api/v1/$\{segment}
            - name: CircuitBreaker
              args:
                name: inventoryCircuitBreaker
                fallbackUri: forward:/fallback/service

        - id: payment-service-dead-letters
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/admin/payment/dead-letters/**
          filters:
            - RewritePath=/api/v1/admin/payment/(?<segment>.*), /api/v1/$\{segment}
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/service

        - id: notification-service-dead-letters
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/admin/notification/dead-letters/**
          filters:
            - RewritePath=/api/v1/admin/notification/(?<segment>.*), /api/v1/$\{segment}
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/service

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 30000ms
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      orderCircuitBreaker:
        baseConfig: default
      customerCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      catalogCircuitBreaker:
        baseConfig: default
      notificationCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        cancelRunningFuture: true
        timeoutDuration: 10000ms
    instances:
      orderCircuitBreaker:
        baseConfig: default
      customerCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      catalogCircuitBreaker:
        baseConfig: default
      notificationCircuitBreaker:
        baseConfig: default

eureka:
  client:
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9080}
  endpoints:
    web:
      exposure:
        # Replaces (not extends) the global list: the gateway's own circuit-breaker dashboard endpoints.
        include: health,info,prometheus,circuitbreakers,circuitbreaker-events,busrefresh
  metrics:
    export:
      simple:
        enabled: true

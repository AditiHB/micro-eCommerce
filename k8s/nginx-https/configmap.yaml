apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ecommerce
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 20M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript
                   application/json application/javascript application/xml+rss
                   application/rss+xml font/truetype font/opentype
                   application/vnd.ms-fontobject image/svg+xml;

        # Include SSL configuration
        include /etc/nginx/ssl.conf;
        include /etc/nginx/upstream.conf;

        # HTTP to HTTPS redirect
        server {
            listen 80;
            server_name _;
            return 301 https://$host$request_uri;
        }

        # HTTPS server configuration
        server {
            listen 443 ssl http2;
            server_name _;

            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;

            include /etc/nginx/ssl-params.conf;

            # Security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

            # API Gateway routes
            location /api/ {
                proxy_pass http://api-gateway:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
            }

            # Customer Service routes
            location /customers/ {
                proxy_pass http://customer-service:8081/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_http_version 1.1;
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
            }

            # Order Service routes
            location /orders/ {
                proxy_pass http://order-service:8083/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_http_version 1.1;
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
            }

            # Inventory Service routes
            location /inventory/ {
                proxy_pass http://inventory-service:8082/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_http_version 1.1;
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
            }

            # Payment Service routes
            location /payments/ {
                proxy_pass http://payment-service:8084/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $server_name;
                proxy_http_version 1.1;
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
            }

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Deny access to sensitive paths
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }
        }
    }

  ssl.conf: |
    # SSL/TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_ecdh_curve auto;

  ssl-params.conf: |
    # Additional SSL security parameters
    include /etc/nginx/ssl.conf;
    ssl_verify_depth 2;
    ssl_buffer_size 4k;

  upstream.conf: |
    upstream api-gateway {
        least_conn;
        server api-gateway:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream customer-service {
        least_conn;
        server customer-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream order-service {
        least_conn;
        server order-service:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream inventory-service {
        least_conn;
        server inventory-service:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment-service {
        least_conn;
        server payment-service:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

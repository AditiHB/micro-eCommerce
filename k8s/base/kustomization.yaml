apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 02-rbac.yaml
  - 03-messaging.yaml
  - 04-redis.yaml
  - 05-discovery-server.yaml
  - 06-config-server.yaml
  - 07-api-gateway.yaml
  - 08-customer-service.yaml
  - 09-order-service.yaml
  - 10-inventory-service.yaml
  - 11-payment-service.yaml
  - 12-notification-service.yaml
  - 13-hpa.yaml
  - 14-keycloak.yaml

# The Secret and the Keycloak ConfigMaps are built from git-ignored files that scripts/gen-k8s-secrets.sh
# writes into ./generated/ from your own .env. No credential is committed to this repository.
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: ecommerce-secrets
    namespace: ecommerce
    envs:
      - generated/secrets.env
configMapGenerator:
  - name: keycloak-realm
    namespace: ecommerce
    files:
      - realm-ecommerce.json=generated/realm-ecommerce.json
  - name: keycloak-seed-script
    namespace: ecommerce
    files:
      - seed-dev.sh=generated/seed-dev.sh

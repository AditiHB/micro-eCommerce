# Real, declarative autoscaling - the only "scaling" in the original
# manifests was a single imperative `kubectl autoscale` example in
# docs/KUBERNETES_DEPLOYMENT.md, never a committed resource, so it vanished
# the moment anyone ran `kubectl apply` fresh. These HorizontalPodAutoscalers
# are now part of the deployed state itself.
#
# Requires metrics-server in the cluster (CPU/memory metrics come from
# there, not from Kubernetes core) - see docs/KUBERNETES_DEPLOYMENT.md's
# "Enable autoscaling" step for enabling it on Minikube/Kind. Without it,
# `kubectl get hpa` will show `<unknown>` under TARGETS forever instead of a
# percentage, and no scaling will ever trigger.
#
# discovery-server and config-server are deliberately NOT autoscaled here:
# Eureka's self-preservation/peer-replication model and the config-server's
# git-backed, read-mostly workload don't behave like a typical stateless
# HTTP tier under naive CPU-based HPA, and this project only ever runs one
# replica of each by design (see discovery-server's own
# register-with-eureka: false).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---

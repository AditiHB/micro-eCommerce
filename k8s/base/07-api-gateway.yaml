# Fixes two confirmed bugs from the original 06-api-gateway.yaml:
#
# 1. No Redis env vars at all were set here, but RateLimitingFilter
#    (infrastructure/api-gateway/.../filter/RateLimitingFilter.java) makes a
#    blocking Redis call on every rate-limited request. Without REDIS_HOST,
#    spring.data.redis.host defaults to localhost - no Redis there in this
#    pod - so every gated request threw and the gateway was a 100%-failure
#    outage for anything behind a rate-limited route. REDIS_HOST=redis fixes
#    it the same way docker-compose.yml already does for this service.
#
# 2. No route config needed here at all, in either form: the image's own
#    classpath application.yml already defines every route via Eureka
#    service discovery (uri: lb://order-service, etc.), not hardcoded
#    host:port pairs. The original setup mounted a ConfigMap with hardcoded
#    `http://order-service:8082`-style routes instead - on top of using the
#    wrong port for order-service and inventory-service (they were swapped
#    relative to both docker-compose.yml and each service's own
#    application.yml default - see 09/10 in this directory). Since lb://
#    routes are resolved via Eureka, EUREKA_INSTANCE_PREFER_IP_ADDRESS=true is
#    what actually matters here (see customer-service for why).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: api-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: micro-ecommerce:api-gateway
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        - containerPort: 9080
          name: management
        env:
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: eureka-password
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: SPRING_CLOUD_CONFIG_FAILFAST
          value: "true"
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: config-server-password
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          value: "kafka:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka:$(EUREKA_PASSWORD)@discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: SECURITY_ISSUER
          value: "http://localhost:8180/realms/ecommerce"
        - name: SECURITY_JWK_SET_URI
          value: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
        - name: SECURITY_AUDIENCE
          value: "ecommerce-api"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: redis-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP

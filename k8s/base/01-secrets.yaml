# Local-dev-only values, same as docker-compose.yml's own defaults - never used
# as real secrets. Rotate/replace before pointing this at anything but a local
# learning cluster.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  jwt-secret: "local-dev-only-secret-key-for-development-use-only-do-not-use-in-production"

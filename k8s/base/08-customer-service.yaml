# Default (H2) profile: no SPRING_PROFILES_ACTIVE and no datasource env vars
# at all - the image's own classpath application.yml already defaults to an
# in-process H2 database (${DB_URL:jdbc:h2:mem:customer_db}) with Flyway
# migrations from db/migration/h2. This exactly matches docker-compose.yml's
# default profile. For a real, shared Postgres database instead (required
# for horizontally-scaled replicas to agree on the same data - see
# overlays/postgres's own README), apply that overlay instead of this base
# directly.
#
# EUREKA_INSTANCE_PREFER_IP_ADDRESS=true matters more in Kubernetes than it
# did in Docker Compose: Eureka's default is to register instances by
# hostname, and a Deployment's pods (unlike a StatefulSet's) don't get
# individually resolvable DNS names - only the Service does. Without this,
# the API Gateway's `lb://customer-service` route (baked into its own image)
# would resolve to an unreachable pod hostname instead of the pod's real,
# routable IP, and the saga's Eureka-discovered calls would fail the same
# way. Docker Compose never hit this because container hostnames there are
# resolvable via Docker's own embedded DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: customer-service-sa
      containers:
      - name: customer-service
        image: micro-ecommerce:customer-service
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: REDIS_HOST
          value: "redis"
        # The real property path for Spring Boot 3's autoconfigured Redis
        # connection factory (which RedisConfig's distributed CacheManager
        # bean depends on) - this service's own application.yml still
        # configures the pre-Boot-3 spring.redis.* path, which nothing reads
        # anymore. See RedisConfig's javadoc for how this was found.
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP

# No volume/ConfigMap for the git-backed config repo - it's already baked
# into the image at /app/config-repo by Dockerfile.config-server, matching
# the service's own classpath default (git.uri: file:///app/config-repo).
# docker-compose.yml instead bind-mounts ./config-repo and overrides the git
# URI to match - unnecessary here since the image already has its own copy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: config-server-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: config-server
        image: micro-ecommerce:config-server
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8888
        - containerPort: 9888
          name: management
        env:
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: config-server-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9888
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9888
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP

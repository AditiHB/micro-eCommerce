# Port 8083 - matches both docker-compose.yml and this service's own
# application.yml default. The original 08-order-service.yaml used 8082
# instead (and 09-inventory-service.yaml used 8083) - the two were swapped
# relative to everything else in the codebase, consistently enough
# internally (gateway ConfigMap route, Service, container port, SERVER_PORT
# env var all agreed with each other) that it would have run without
# crashing, just on the wrong, confusing port versus every other deployment
# path for this same service. See customer-service for the H2-default and
# EUREKA_INSTANCE_PREFER_IP_ADDRESS notes - same reasoning applies here. No
# REDIS_HOST: order-service doesn't get one in docker-compose.yml either
# (harmless either way - this app's caching is in-process, not Redis-backed;
# see common/config/RedisConfig's own javadoc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: order-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-service
        image: micro-ecommerce:order-service
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8083
        - containerPort: 9083
          name: management
        env:
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: eureka-password
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: SPRING_CLOUD_CONFIG_FAILFAST
          value: "true"
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: config-server-password
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          value: "kafka:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka:$(EUREKA_PASSWORD)@discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        # Needed for RedisConfig's distributed CacheManager bean (see its
        # own javadoc) - this service's application.yml never configures
        # Redis connectivity at all otherwise.
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SECURITY_ISSUER
          value: "http://localhost:8180/realms/ecommerce"
        - name: SECURITY_JWK_SET_URI
          value: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
        - name: SECURITY_AUDIENCE
          value: "ecommerce-api"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: redis-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9083
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9083
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP

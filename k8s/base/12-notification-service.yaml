# CUSTOMER_SERVICE_URL/ORDER_SERVICE_URL are plain Kubernetes Service DNS
# names (CustomerClient/OrderClient call them directly, not via Eureka's
# lb:// scheme), so they work regardless of Eureka IP-preference. The
# original 18-notification-service.yaml pointed ORDER_SERVICE_URL at port
# 8083 while order-service's own Deployment at the time actually listened on
# 8082 (the swapped-port bug - see order-service's header comment) - every
# call from notification-service to order-service would have 404'd/refused
# the moment anything actually exercised that path. Now consistent: order-
# service really does listen on 8083.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: service
    spec:
      serviceAccountName: notification-service-sa
      containers:
      - name: notification-service
        image: micro-ecommerce:notification-service
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: CUSTOMER_SERVICE_URL
          value: "http://customer-service:8081"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8083"
        - name: NOTIFICATION_CHANNEL
          value: "log"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP

# CUSTOMER_SERVICE_URL/ORDER_SERVICE_URL are plain Kubernetes Service DNS
# names (CustomerClient/OrderClient call them directly, not via Eureka's
# lb:// scheme), so they work regardless of Eureka IP-preference. The
# original 18-notification-service.yaml pointed ORDER_SERVICE_URL at port
# 8083 while order-service's own Deployment at the time actually listened on
# 8082 (the swapped-port bug - see order-service's header comment) - every
# call from notification-service to order-service would have 404'd/refused
# the moment anything actually exercised that path. Now consistent: order-
# service really does listen on 8083.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: notification-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: notification-service
        image: micro-ecommerce:notification-service
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8086
        - containerPort: 9086
          name: management
        env:
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: eureka-password
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: SPRING_CLOUD_CONFIG_FAILFAST
          value: "true"
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: config-server-password
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          value: "kafka:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka:$(EUREKA_PASSWORD)@discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: CUSTOMER_SERVICE_URL
          value: "http://customer-service:8081"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8083"
        - name: NOTIFICATION_CHANNEL
          value: "log"
        - name: SECURITY_ISSUER
          value: "http://localhost:8180/realms/ecommerce"
        - name: SECURITY_JWK_SET_URI
          value: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
        - name: SECURITY_AUDIENCE
          value: "ecommerce-api"
        - name: KEYCLOAK_TOKEN_URI
          value: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/token"
        - name: NOTIFICATION_CLIENT_ID
          value: "notification-service"
        - name: NOTIFICATION_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: notification-client-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9086
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9086
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP

# Port 8082 - see order-service's header comment for why this and
# order-service's port were swapped in the original manifests and are fixed
# here. REDIS_HOST=redis set here to match docker-compose.yml's own
# inventory-service block (harmless either way - see order-service's note).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: inventory-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory-service
        image: micro-ecommerce:inventory-service
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8082
        - containerPort: 9082
          name: management
        env:
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: eureka-password
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka:$(EUREKA_PASSWORD)@discovery-server:8761/eureka/"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: REDIS_HOST
          value: "redis"
        # The real property path for Spring Boot 3's autoconfigured Redis
        # connection factory (which RedisConfig's distributed CacheManager
        # bean depends on) - see RedisConfig's javadoc.
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SECURITY_ISSUER
          value: "http://localhost:8180/realms/ecommerce"
        - name: SECURITY_JWK_SET_URI
          value: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
        - name: SECURITY_AUDIENCE
          value: "ecommerce-api"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: redis-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9082
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9082
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP

# No ConfigMap volume mount here (the original manifest mounted a
# discovery-server-config ConfigMap at /app/config/application.yml) - it
# duplicated values already baked into the image's own classpath
# application.yml and had drifted from it in places (e.g. a hardcoded
# ddl-auto: update elsewhere in that same pattern, fighting Flyway's own
# schema versioning - see docs/KUBERNETES_DEPLOYMENT.md). Matching
# docker-compose.yml's own approach instead: only override what actually
# needs to differ per-environment, as plain env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
        tier: service
    spec:
      enableServiceLinks: false
      serviceAccountName: discovery-server-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: discovery-server
        image: micro-ecommerce:discovery-server
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8761
        - containerPort: 9761
          name: management
        env:
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: eureka-password
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888/"
        - name: SPRING_CLOUD_CONFIG_FAILFAST
          value: "true"
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: config-server-password
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          value: "kafka:9092"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9761
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9761
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: discovery-server
  ports:
  - port: 8761
    targetPort: 8761
    protocol: TCP

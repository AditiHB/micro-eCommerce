---
# This file contains the mTLS updates that should be applied to existing deployments
# Apply these updates to the following deployments:
# - 07-customer-service.yaml
# - 08-order-service.yaml
# - 09-inventory-service.yaml
# - 10-payment-service.yaml
# - 06-api-gateway.yaml
# - 05-config-server.yaml
# - 04-discovery-server.yaml

# UPDATED: 08-order-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: micro-ecommerce:order-service
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8083
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: SERVICE_NAME
          value: "order-service"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:order_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: db-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: db-password
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: redis-password
        - name: SPRING_REDIS_DATABASE
          value: "1"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: jwt-secret
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "https://discovery-server.ecommerce.svc.cluster.local:8761/eureka/"
        # SSL/TLS Configuration
        - name: SERVER_SSL_ENABLED
          value: "true"
        - name: SERVER_SSL_KEY_STORE_TYPE
          value: "PKCS12"
        - name: SERVER_SSL_KEY_STORE
          value: "/etc/certs/order-service/tls.crt"
        - name: SERVER_SSL_KEY_STORE_PASSWORD
          value: "changeit"
        - name: SERVER_SSL_CLIENT_AUTH
          value: "need"
        - name: SERVER_SSL_KEY_ALIAS
          value: "order-service"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
            scheme: HTTPS
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
        # Certificate volumes
        - name: order-service-tls
          mountPath: /etc/certs/order-service
          readOnly: true
        - name: ca-certificate
          mountPath: /etc/certs/ca
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: order-service-config
      # Certificate volumes from secrets
      - name: order-service-tls
        secret:
          secretName: order-service-tls
          defaultMode: 0400
      - name: ca-certificate
        secret:
          secretName: ca-key-pair
          defaultMode: 0400


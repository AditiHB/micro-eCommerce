---
# Customer Service Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customer-service-cert
  namespace: ecommerce
spec:
  secretName: customer-service-tls
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  commonName: customer-service.default.svc.cluster.local
  dnsNames:
    - customer-service
    - customer-service.default
    - customer-service.default.svc
    - customer-service.default.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer


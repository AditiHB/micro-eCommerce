# Real, shared Postgres instead of each pod's own private in-process H2 - the fix for multi-replica
# correctness. One database and one owner role per service, created by the SAME init script Docker
# Compose uses (infrastructure/postgres/init-multiple-postgres-databases.sh, copied next to this file as
# generated/ by scripts/gen-k8s-secrets.sh and turned into the postgres-init-script ConfigMap by this
# overlay's kustomization). Passwords come from the ecommerce-secrets Secret; nothing is hard-coded.
#
# History worth keeping: the previous inline copy of the script used `psql -c "...\gexec"`, which
# is a psql meta-command that only works on stdin - every database silently failed to be created and
# every service then crash-looped with "FATAL: database ... does not exist". The shared script feeds
# SQL through a here-document, which is why it works.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      # See k8s/base/03-messaging.yaml's kafka container for why this
      # matters: Kubernetes auto-injects a POSTGRES_PORT env var once this
      # Service exists, which the postgres image itself ignores, but it's
      # the same class of foot-gun other tools do crash on - disabled
      # uniformly across every pod in this project rather than case-by-case.
      enableServiceLinks: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: postgres-admin-password
        - name: POSTGRES_MULTIPLE_DATABASES
          value: "customer_db,inventory_db,order_db,payment_db,notification_db"
        - name: CUSTOMER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: customer-db-password
        - name: ORDER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: order-db-password
        - name: INVENTORY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: inventory-db-password
        - name: PAYMENT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: payment-db-password
        - name: NOTIFICATION_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: notification-db-password
        - name: VAULT_DB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: vault-db-admin-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

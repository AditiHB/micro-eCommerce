# Mirrors docker-compose-postgres.yml exactly (same image, same credentials,
# same one-database-per-service layout via the same init script) so this
# overlay is a drop-in, already-proven substitute rather than a fresh,
# untested design. This is also what fixes the real "scaling" bug: every
# service in k8s/base defaults to an in-process H2 database, so two replicas
# of the same service silently disagree about what data exists. Applying
# this overlay (SPRING_PROFILES_ACTIVE=postgres, DB_HOST=postgres - see this
# directory's kustomization.yaml) switches all 5 business services onto this
# single, shared Postgres instance instead, via each service's own
# application-postgres.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: ecommerce
data:
  init-multiple-postgres-databases.sh: |
    #!/bin/bash
    # Creates one database per service, since the official postgres image
    # only creates the single database named by POSTGRES_DB. Reads a
    # comma-separated list from POSTGRES_MULTIPLE_DATABASES. Same intent as
    # infrastructure/postgres/init-multiple-postgres-databases.sh (used by
    # docker-compose-postgres.yml), but a plain existence-check-then-create
    # instead of that script's \gexec trick - confirmed live (via kubectl
    # logs postgres-0) that \gexec is a psql-interactive-only meta-command;
    # handed through `psql -c "...\gexec"` it isn't interpreted at all, it's
    # sent to the server as literal SQL text, which Postgres then rejects
    # with a syntax error - every database silently failed to get created
    # as a result, confirmed by every business service then crash-looping
    # with "FATAL: database ... does not exist".
    set -e

    if [ -n "$POSTGRES_MULTIPLE_DATABASES" ]; then
        echo "Creating databases: $POSTGRES_MULTIPLE_DATABASES"
        IFS=',' read -ra DATABASES <<< "$POSTGRES_MULTIPLE_DATABASES"
        for db in "${DATABASES[@]}"; do
            db="$(echo "$db" | xargs)"
            EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" --username "$POSTGRES_USER" --dbname "postgres")
            if [ "$EXISTS" = "1" ]; then
                echo "Database '$db' already exists, skipping"
            else
                echo "Creating database '$db' owned by '$POSTGRES_USER'"
                psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" \
                  -c "CREATE DATABASE \"$db\" OWNER \"$POSTGRES_USER\""
            fi
        done
    fi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      # See k8s/base/03-messaging.yaml's kafka container for why this
      # matters: Kubernetes auto-injects a POSTGRES_PORT env var once this
      # Service exists, which the postgres image itself ignores, but it's
      # the same class of foot-gun other tools do crash on - disabled
      # uniformly across every pod in this project rather than case-by-case.
      enableServiceLinks: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "ecommerce_user"
        - name: POSTGRES_PASSWORD
          value: "ecommerce_password"
        - name: POSTGRES_MULTIPLE_DATABASES
          value: "customer_db,inventory_db,order_db,payment_db,notification_db,product_db"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "ecommerce_user"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "ecommerce_user"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

# Real, shared Postgres instead of each pod's own private in-process H2 -
# see postgres.yaml's header for why this is the fix for multi-replica
# correctness, not just an extra option. Deploy with:
#
#   kubectl apply -k k8s/overlays/postgres
#
# ddl-auto is "validate" under the postgres Spring profile (see each
# service's application-postgres.yml) - Flyway owns schema creation here,
# matching db/README.md's documented vendor-folder convention
# (db/migration/postgresql/*.sql per service).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres.yaml

patches:
  - target:
      kind: Deployment
      name: customer-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: customer-service
      spec:
        template:
          spec:
            containers:
            - name: customer-service
              env:
              - name: SPRING_PROFILES_ACTIVE
                value: postgres
              - name: DB_HOST
                value: postgres
              # One least-privilege owner role per service (see the init script); password from the Secret.
              - name: DB_USERNAME
                value: customer_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ecommerce-secrets
                    key: customer-db-password
  - target:
      kind: Deployment
      name: order-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
      spec:
        template:
          spec:
            containers:
            - name: order-service
              env:
              - name: SPRING_PROFILES_ACTIVE
                value: postgres
              - name: DB_HOST
                value: postgres
              # One least-privilege owner role per service (see the init script); password from the Secret.
              - name: DB_USERNAME
                value: order_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ecommerce-secrets
                    key: order-db-password
  - target:
      kind: Deployment
      name: inventory-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inventory-service
      spec:
        template:
          spec:
            containers:
            - name: inventory-service
              env:
              - name: SPRING_PROFILES_ACTIVE
                value: postgres
              - name: DB_HOST
                value: postgres
              # One least-privilege owner role per service (see the init script); password from the Secret.
              - name: DB_USERNAME
                value: inventory_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ecommerce-secrets
                    key: inventory-db-password
  - target:
      kind: Deployment
      name: payment-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        template:
          spec:
            containers:
            - name: payment-service
              env:
              - name: SPRING_PROFILES_ACTIVE
                value: postgres
              - name: DB_HOST
                value: postgres
              # One least-privilege owner role per service (see the init script); password from the Secret.
              - name: DB_USERNAME
                value: payment_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ecommerce-secrets
                    key: payment-db-password
  - target:
      kind: Deployment
      name: notification-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-service
      spec:
        template:
          spec:
            containers:
            - name: notification-service
              env:
              - name: SPRING_PROFILES_ACTIVE
                value: postgres
              - name: DB_HOST
                value: postgres
              # One least-privilege owner role per service (see the init script); password from the Secret.
              - name: DB_USERNAME
                value: notification_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ecommerce-secrets
                    key: notification-db-password

configMapGenerator:
  - name: postgres-init-script
    namespace: ecommerce
    files:
      - init-multiple-postgres-databases.sh=generated/init-multiple-postgres-databases.sh
generatorOptions:
  disableNameSuffixHash: true

---
# api-gateway: no server.ssl - its inbound side (nginx -> gateway) is untouched, see its own
# application-mtls.yml. It needs a PKCS12 keystore instead of the PEM pair every other service
# gets, because Spring Cloud Gateway 4.1's outbound client can't take a Spring SSL bundle - cert-
# manager emits one natively as an extra key in the same Secret (keystore.p12), so there's no
# manual openssl/keytool conversion step in k8s, unlike Compose's pki-keystore equivalent.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-keystore-password
  namespace: ecommerce
type: Opaque
stringData:
  # Protects the keystore's integrity only, not a secret - same "changeit" convention already
  # used by docker-compose.pki.yml's pki-truststore and infrastructure/pki/pkcs12-password.
  password: changeit
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-gateway-tls
  namespace: ecommerce
spec:
  secretName: api-gateway-tls
  duration: 24h
  renewBefore: 8h
  dnsNames:
    - api-gateway
    - api-gateway.ecommerce.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: api-gateway-keystore-password
        key: password
  issuerRef:
    name: ecommerce-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

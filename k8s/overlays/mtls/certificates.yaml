# One short-lived leaf certificate per backend service, issued by the platform CA bootstrapped in
# cluster-issuer.yaml. SANs are the bare k8s Service name and its FQDN - every service's own
# application-mtls.yml (common to Compose and k8s) advertises the bare name to Eureka, so the
# gateway's lb://<service> route resolves to https://<service>:<port>, which must match a SAN here.
# duration/renewBefore mirror Docker Compose's step-ca certs (24h, renewed with 8h left) for parity,
# though cert-manager renews by rewriting the Secret in place - no renewer sidecar needed here,
# unlike Compose's pki-renewer (the kubelet syncs a mounted Secret volume within ~60-90s).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customer-service-tls
  namespace: ecommerce
spec:
  secretName: customer-service-tls
  duration: 24h
  renewBefore: 8h
  dnsNames:
    - customer-service
    - customer-service.ecommerce.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: ecommerce-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---

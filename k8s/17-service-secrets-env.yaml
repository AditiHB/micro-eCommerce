# Example: Inject secrets as environment variables into service pods
# This is applied alongside the service deployment manifests

---
# Customer Service Secrets Injection
apiVersion: v1
kind: Patch
metadata:
  name: customer-service-secrets-patch
spec:
  patchType: strategic
  patch: |
    spec:
      template:
        spec:
          containers:
          - name: customer-service
            env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  namespace: ecommerce-secrets
                  key: secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  namespace: ecommerce-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  namespace: ecommerce-secrets
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  namespace: ecommerce-secrets
                  key: password

